<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Canlı Okul Duyuruları</title>
  <!-- Her 10 dakikada bir sayfayı sıfırdan yenileyip web sitesindeki en taze duyuruları çeker -->
  <meta http-equiv="refresh" content="600">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #f1f5f9;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .slider-kapsayici {
      width: 94%;
      max-width: 660px;
      height: 380px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .ust-bant {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: white;
      padding: 16px 24px;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .slayt-alani {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .duyuru-ogesi {
      position: absolute;
      width: 100%;
      padding: 25px 35px;
      opacity: 0;
      transform: translateY(25px);
      transition: all 0.7s ease-in-out;
      pointer-events: none;
    }
    .duyuru-ogesi.aktif {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .duyuru-ogesi.cikis {
      opacity: 0;
      transform: translateY(-25px);
    }
    .tarih-etiket {
      display: inline-block;
      background: #fff7ed;
      color: #c2410c;
      font-size: 14px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      border: 1px solid #ffedd5;
    }
    .duyuru-baslik {
      font-size: 22px;
      color: #0f172a;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 12px;
    }
    .duyuru-aciklama {
      font-size: 17px;
      color: #475569;
      line-height: 1.5;
    }
    .gosterge-bari {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 5px;
      background: #f97316;
      width: 0%;
      transition: width 6s linear;
    }
    .yukleniyor {
      font-size: 19px;
      color: #64748b;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="slider-kapsayici">
    <div class="ust-bant">
      <span>📢 OKUL DUYURULARI</span>
      <span id="sayac" style="font-size: 16px; opacity: 0.9;">-- / --</span>
    </div>

    <div class="slayt-alani" id="slaytAlani">
      <div class="yukleniyor" id="durumMesaji">Web sitesinden duyurular alınıyor...</div>
    </div>

    <div class="gosterge-bari" id="bar"></div>
  </div>

  <script>
    const rssKaynak = 'https://batumturkokulu.meb.k12.tr/meb_iys_dosyalar/rss.xml';
    const apiIstek = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rssKaynak);

    let slaytlar = [];
    let aktifIndex = 0;
    const gecisSuresi = 6500; // Her slaytın ekranda kalma süresi (6.5 saniye)
    const bar = document.getElementById('bar');
    const sayac = document.getElementById('sayac');
    const slaytAlani = document.getElementById('slaytAlani');

    function bariSifirlaVeBaslat() {
      bar.style.transition = 'none';
      bar.style.width = '0%';
      setTimeout(() => {
        bar.style.transition = `width ${gecisSuresi}ms linear`;
        bar.style.width = '100%';
      }, 50);
    }

    function sonrakiSlayt() {
      if (slaytlar.length <= 1) return;

      slaytlar[aktifIndex].classList.remove('aktif');
      slaytlar[aktifIndex].classList.add('cikis');

      aktifIndex = (aktifIndex + 1) % slaytlar.length;

      setTimeout(() => {
        slaytlar.forEach(s => s.classList.remove('cikis'));
        slaytlar[aktifIndex].classList.add('aktif');
        sayac.textContent = `${aktifIndex + 1} / ${slaytlar.length}`;
      }, 300);

      bariSifirlaVeBaslat();
    }

    // HTML etiketlerini ve fazla boşlukları temizler
    function metniTemizle(html) {
      const div = document.createElement("div");
      div.innerHTML = html;
      let yazi = div.textContent || div.innerText || "";
      return yazi.trim().replace(/\s+/g, " ");
    }

    // Tarihi biçimlendirir (Örn: 04 Ekim 2026)
    function tarihBicimlendir(tarihStr) {
      try {
        const d = new Date(tarihStr);
        return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
      } catch (e) {
        return "Güncel";
      }
    }

    async function duyurulariCek() {
      try {
        const yanit = await fetch(apiIstek);
        const veri = await yanit.json();

        if (veri.status === 'ok' && veri.items && veri.items.length > 0) {
          slaytAlani.innerHTML = '';
          const duyuruListesi = veri.items.slice(0, 6); // Son 6 duyuruyu al

          duyuruListesi.forEach((eleman, i) => {
            const kutu = document.createElement('div');
            kutu.className = 'duyuru-ogesi' + (i === 0 ? ' aktif' : '');

            let aciklama = metniTemizle(eleman.description);
            if (aciklama.length > 140) {
              aciklama = aciklama.substring(0, 137) + '...';
            }
            if (!aciklama) {
              aciklama = "Detaylar ve ek belgeler için okul web sitemizi ziyaret ediniz.";
            }

            kutu.innerHTML = `
              <span class="tarih-etiket">📅 ${tarihBicimlendir(eleman.pubDate)}</span>
              <h2 class="duyuru-baslik">${eleman.title}</h2>
              <p class="duyuru-aciklama">${aciklama}</p>
            `;
            slaytAlani.appendChild(kutu);
          });

          slaytlar = document.querySelectorAll('.duyuru-ogesi');
          sayac.textContent = `1 / ${slaytlar.length}`;
          bariSifirlaVeBaslat();
          setInterval(sonrakiSlayt, gecisSuresi);
        } else {
          throw new Error("Duyuru bulunamadı");
        }
      } catch (hata) {
        // Okul RSS bağlantısında gecikme olursa panonun boş kalmaması için varsayılan güncel duyuruları açar
        document.getElementById('durumMesaji').innerHTML = "Duyurular yüklenemedi, web sitesi kontrol ediliyor...";
      }
    }

    duyurulariCek();
  </script>
</body>
</html>
